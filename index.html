<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pooja Bunga Pitriana - Portfolio</title>
    
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Import FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #d19b9b; 
            color: #fff; 
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center; /* Mengelompokkan semua konten ke tengah secara merata */
            align-items: center;
            width: 100%;
            max-width: 1400px;
            gap: 80px; /* Jarak fix antar kolom agar tidak ada space kosong yang aneh */
        }

        /* --- Kolom Kiri --- */
        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 30px;
            color: #fff;
        }

        .roles {
            margin-bottom: 40px;
        }

        .roles p {
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: #fff;
        }

        .description {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            color: #fff;
        }

        /* --- Kolom Tengah --- */
        .center-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-img {
            width: 320px;
            height: 480px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .social-icons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            align-self: flex-start;
            padding-left: 10px;
        }

        .social-icons i {
            font-size: 1.8rem;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .social-icons i:hover {
            opacity: 0.7;
        }

        /* --- Kolom Kanan --- */
        .right-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* Memastikan elemen kanan rapi sejajar ke kiri kolomnya */
        }

        .contact-info {
            margin-bottom: 70px;
        }

        .contact-info a {
            display: flex;
            align-items: center;
            font-size: 1rem;
            color: #fff;
            text-decoration: none;
            margin-bottom: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .contact-info a span {
            margin-right: 15px;
            font-size: 1.3rem;
        }

        .sec-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* --- Responsif untuk Layar Laptop Kecil & Mobile --- */
        @media (max-width: 1200px) {
            .container { gap: 40px; }
            .name { font-size: 3.5rem; }
            .main-img { width: 280px; height: 420px; }
            .sec-img { width: 160px; height: 160px; }
        }

        @media (max-width: 860px) {
            .container {
                flex-direction: column;
                text-align: center;
                gap: 50px;
            }
            .right-col { align-items: center; }
            .social-icons { align-self: center; padding-left: 0; }
            .center-col { order: -1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kolom Kiri -->
        <div class="left-col">
            <h1 class="name">Pooja<br>Bunga<br>Pitriana</h1>
            
            <div class="roles">
                <p>Quality Control (QC)</p>
                <p>Research and Development (R&D)</p>
                <p>Training Development</p>
            </div>
            
            <div class="description">
                <p>Fresh Graduate in<br>Agroindustrial Technology<br>Education</p>
            </div>
        </div>

        <!-- Kolom Tengah -->
        <div class="center-col">
            <img src="FOTO_UTAMA.jpg" alt="Pooja Bunga Pitriana" class="main-img">
            
            <div class="social-icons">
				<a href="https://www.linkedin.com/in/poojabunga/">
					<i class="fab fa-linkedin"></i>
				</a>
				<a href="https://www.instagram.com/poojabp_/">
					<i class="fab fa-instagram"></i>
				</a>
            </div>
        </div>

        <!-- Kolom Kanan -->
        <div class="right-col">
            <div class="contact-info">
                <a href="mailto:poojabptr@gmail.com">
                    <span>&rarr;</span> poojabptr@gmail.com
                </a>
                <a href="https://wa.me/6283821758091">
                    <span>&rarr;</span> +6283 821 758 091
                </a>
            </div>
            
            <img src="FOTO_KECIL.jpg" alt="Portrait" class="sec-img">
        </div>
    </div>

</body>
</html>
